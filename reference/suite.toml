# JRC-EU-TIMES, PSI WIMBY version (James, 29 Oct 2026: one scenario for now).
# EU27 + CH, NO, UK; 12 time slices; milestone years 2019-2050; TIMES v4.8.3 at PSI.
# PSI's repository holds only GAMS DUMPOPT=11 dumps of nine scenarios; the DD files
# were cut unchanged out of them and the run files rebuilt (provenance, checks and
# the 28 Oct 2026 solves in {jrc_eu_times}/dd/README.md). Large: 13.5 M rows,
# 19.0 M columns as run (all nine scenarios are the same size); CPLEX barrier ~2.4 h
# at 5 threads (PSI's cplex.opt: barrier, no crossover). cli_ll (James, 29 Oct 2026):
# the scenario closest to PSI's objective on 28 Oct (relative 4.8e-9).

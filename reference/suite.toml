# Test-model rule (CLAUDE.md "Test-model licences", docs/test-models.md):
# the translation is developed and tested only on models released under a
# clearly stated open-source or open-data licence that allows redistribution
# and derivative works. A model with no stated licence, or a closed-source
# model, is never used: not for references, fixtures, crafted cases, timings,
# profiling or debugging. Users may later run TIMES.jl on proprietary models;
# the translation and its improvement do not learn from them.
# Every [[model]] states `licence` (SPDX id), `source_repo`, `licence_url`
# and `licence_checked` (YYYY-MM-DD); reference/python/test_suite.py fails
# if any is missing, if the licence is not open (unless the entry names an
# `exception`), or if the source is on the blocked list below.
#
# Licences (checked 27 Oct 2026; JRC-EU-TIMES 29 Oct; OTCGEN, OTNYC 30 Oct). `redistribute` says
# what may be published with this repository:
#   "public"   references and fixtures derived from the model;
#   "summary"  only summary results: model size, solve status, objective values,
#              timings, gate verdicts and differences (summary.csv). References,
#              dumps and fixtures stay on James's machine and are not committed;
#   "private"  nothing (the TIM exception).
#   TIMES_Demo   data CC-BY-4.0, code GPL-3.0 (IEA-ETSAP)   redistribute = public
#   TIMES-NZ     MIT (EECA; 3.0.8 DD export, esma-ie fork)    redistribute = public
#   OTUS9r       CC-BY-SA-4.0 (ESMA; EPA EPAUS9rT origin)     redistribute = public
#   OTCGEN       CC-BY-SA-4.0 (ESMA; EPA Generative COMET)    redistribute = public
#   OTNYC        CC-BY-SA-4.0 (ESMA; EPA COMET-NYC origin)    redistribute = public
#   JRC-EU-TIMES GPL-3.0-or-later (PSI WIMBY, "Copyright      redistribute = summary
#                (C) 2025 WIMBY"), over JRC-EU-TIMES data (JRC, CC BY 4.0)
#                (James, 29 Oct 2026: publish only the summary results)
#
# TIM (CC-BY-NC-SA-4.0, MaREI, UCC) is a named exception for research use only
# (James, 27 Oct 2026): in the suite from 29 Oct 2026 as a local source (`tim`),
# it runs on James's machine only and nothing derived from it is committed or
# published (redistribute = private).
#
# Blocked sources, never used: the esma-cgep archive (an archived Columbia
# institution, kept for transparency only; this includes esma-cgep/tim-gams);
# the DemoS step-by-step models (olejandro/demos-dd, Model_Demo_Adv_Veda; no
# licence stated, removed 27 Oct 2026; DemoS_012 stays as TIMES_Demo demo12);
# TIMES-GEO (olejandro/times-geo-gams, no licence file); ETSAP-TIAM.
# Olexandr Balyk's PROTO (olejandro/times.jl, AGPL-3.0) is code, not a test model.
#
# Tiers (James, 30 Oct 2026): `tier = "core"` is the everyday development loop, one
# baseline case per model (BAU or Reference), small enough to rerun every cycle;
# `tier = "milestone"` holds the policy and secondary scenarios and the very large
# models, run at milestone gates or when a change touches a feature only they reach.
# scripts/run_references.ps1 runs the core tier by default (-Set milestone or all for
# the rest); reference/python/test_suite.py allows at most one core case per model.
# OTUS9r-tax1_wo_mou is paused in the milestone tier: its REDUCE-on CPLEX solve did
# not leave crossover in 9 h (29-30 Oct 2026), and its REDUCE-off optimum has unscaled
# infeasibilities; layer 1 passed on it (30 Oct 2026). It stays paused, and
# JRC-EU-TIMES-cli_ll is deferred, until later Phase 1 milestones (James, 31 Oct
# 2026): neither ran for the M1.2 gate.
#
# Milestone at which each model joins the parity suite:
#   M1.1  TIMES_Demo-demo12; TIM (research exception, local only)
#   M1.2  TIMES-NZ 3.0.8, OTUS9r (DD exports of 28 Oct 2026), JRC-EU-TIMES cli_ll;
#         OTCGEN, OTNYC (DD exports of 30 Oct 2026, in the suite from 30 Oct 2026)
#   M1.4  OTAI (see "Planned" below)
#
# Notes
# - "dd" models (none at present) run through reference/templates/scenario.run.
# - The demo12 run file sets DSCAUTO YES, which loads the DSC extension in
#   every run (initmty.mod L453). TIMES_Demo demo12 has no NCAP_DISC or
#   NCAP_SEMI data, so it does not depend on DSC being ported.
# - TIMES_Demo bundles TIMES v4.7.3 in its source/ folder. That folder is never
#   on the include path: times_source (v4.9.7) is always idir1.
# - ESMA model repositories keep their GAMS-ready files in dd/<scenario>/
#   (all .dd files and <scenario>.run) with provenance in dd/README.md.
#
# Planned, not yet in the suite:
#   devtai     ESMA's two-region power model, dd/ once published with an open licence
#   otai       github.com/esma-ie/OTAI            8f2351c   CC-BY-SA-4.0 (ESMA), M1.4
#   jrc_eu     JRC-EU-TIMES v1.1.1 (Zenodo, Veda Excel)     CC-BY-4.0, candidate, M1.4
#              (the PSI WIMBY version, from DD files, is in the suite below)
# TIMES_Demo model-ge (demo12 with MACRO MLF) waits for the MACRO extension,
# after M1.7.

# IEA-ETSAP training model. Its own run file (REDUCE YES, VDA, DSCAUTO, OBJ MOD,
# SOLVEDA) with milestone years trimmed to fit the GAMS community licence.
[[model]]
name = "TIMES_Demo-demo12"
tier = "core"
source_repo = "etsap-TIMES/TIMES_Demo"
licence_url = "https://github.com/etsap-TIMES/TIMES_Demo/blob/master/NOTICE-CC-BY-4.0.txt"
licence_checked = "2026-10-27"
licence = "CC-BY-4.0"
redistribute = "public"
kind = "run"
run_file = "{times_demo}/model/demo12.run"
idirs = ["{times_demo}/model"]


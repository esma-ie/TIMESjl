# OTCGEN (ESMA; CC-BY-SA-4.0 in esma-ie/OTCGEN, from the US EPA's Generative COMET
# v0.0.0, US public domain; the EPA release is populated for New York City). Its
# reference case GC_REF, exported by James on 30 Oct 2026 (Veda2 v5.0.0.0) from a clone
# at tag gcomet-v0.0.0 whose workbooks are byte-identical to the tag (dd/README.md).
# 2 regions (CITY, EGRID), 16 time slices, 24 milestones 2019-2100; REDUCE YES,
# OBJ AUTO, TIMESED NO, BOTIME 1980 and no MID_YEAR, OBLONG or VARCOST switch: the
# second objective configuration on a real model. Has STG_LOSS and STGOUT_BND.
# Preprocesses under v4.9.7 with no domain violations and all QA checks passed
# (30 Oct 2026). 11 MB of DD files. The EPA's policy cases (GC_REF_SUB, GC_REF_ZEV,
# GC_TAX, GC_NZ, GC_REF_nocons) were exported and checked too; they can join the
# milestone tier later.
[[model]]
name = "OTCGEN-gc_ref"
tier = "core"
source_repo = "esma-ie/OTCGEN"
licence_url = "https://github.com/esma-ie/OTCGEN/blob/main/LICENSE"
licence_checked = "2026-10-30"
licence = "CC-BY-SA-4.0"
redistribute = "public"
kind = "run"
run_file = "{otcgen}/dd/gc_ref/gc_ref.run"
idirs = ["{otcgen}/dd/gc_ref"]
solver_opt_dir = "{otcgen}/dd/gc_ref"

# OTNYC (Open TIMES New York City, ESMA; CC-BY-SA-4.0 in esma-ie/OTNYC, from the US
# EPA's COMET-NYC v16.0.1, US public domain). Its reference case S1_NYC_REF, exported by
# James on 30 Oct 2026 (Veda2 v5.0.0.0, one folder per case, replacing the 28 Oct
# export) from a clone at tag comet-nyc-v16.0.1 (dd/README.md).
# 7 regions, 16 time slices, 11 milestones 2010-2055; the same objective switches as
# OTCGEN. Preprocesses under v4.9.7 with no domain violations. QA: 50 *07 "Defective
# sum of FX and UP FLO_SHAREs in Group" (process TPELCCR11, R2-R6, a lone UP share of
# 0.12056; EPA data as released) that TIMES auto-relaxes in preprocessing
# (pp_qafs.mod L66-89), the only open model reaching that branch, and 47 *01
# "DEM commodity with missing COM_PROJ". 18 MB of DD files. The EPA's other cases
# (S2-S5, IRA, LSR, CLCPA, NZ50) were exported and checked too.
[[model]]
name = "OTNYC-s1_nyc_ref"
tier = "core"
source_repo = "esma-ie/OTNYC"
licence_url = "https://github.com/esma-ie/OTNYC/blob/main/LICENSE"
licence_checked = "2026-10-30"
licence = "CC-BY-SA-4.0"
redistribute = "public"
kind = "run"
run_file = "{otnyc}/dd/s1_nyc_ref/s1_nyc_ref.run"
idirs = ["{otnyc}/dd/s1_nyc_ref"]
solver_opt_dir = "{otnyc}/dd/s1_nyc_ref"

